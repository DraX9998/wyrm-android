name: Build Wyrm AI Trainer APK
# Rebuild latest trainer selector and in-game toggle changes.

on:
  workflow_dispatch:
  push:
    branches:
      - feature/treinador-ia-v860-build
    paths:
      - 'app/src/**'
      - 'android/**'
      - 'build.py'
      - '.github/workflows/treinador-ia-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Install Slang shader compiler
        run: |
          curl -L --fail --retry 3 \
            https://github.com/shader-slang/slang/releases/download/v2026.22/slang-2026.22-linux-x86_64.tar.gz \
            -o "$RUNNER_TEMP/slang.tar.gz"
          mkdir -p "$RUNNER_TEMP/slang"
          tar -xzf "$RUNNER_TEMP/slang.tar.gz" -C "$RUNNER_TEMP/slang"
          SLANGC="$(find "$RUNNER_TEMP/slang" -type f -name slangc -print -quit)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"

      - name: Compile Vulkan shaders
        run: python3 build.py 2

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug \
            -PWYRM_VERSION_CODE=861 \
            -PWYRM_VERSION_NAME=8.6.1

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Wyrm-AI-Trainer-v8.6-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
